# EasyCTF Configuration File

# Language Settings
language: "ja"  # Available: "en" (English), "ja" (Japanese)

# Default Game Settings (used when creating new games)
default-game:
  # Enable automatic game start when minimum players join
  auto-start-enabled: false
  
  # Minimum players required to auto-start a game (if enabled)
  min-players: 2
  
  # Maximum players per team
  max-players-per-team: 10
  
  # Respawn delay in seconds (disabled - instant respawn)
  respawn-delay-base: 0
  respawn-delay-per-death: 0  # No additional delay
  respawn-delay-max: 0  # Instant respawn
  
  # Force PVP during combat phase (ignore server pvp settings)
  force-pvp: true

# Default Phase Settings
default-phases:
  # Starting phase duration - time for players to join before game begins (default: 30 seconds)
  starting-duration: 30

  # Phase 1: Build phase duration in seconds (default: 3 minutes)
  build-duration: 180
  
  # Build phase game mode for players
  # Options: ADVENTURE, SURVIVAL, CREATIVE
  # ADVENTURE: Limited interaction, prevents most building
  # SURVIVAL: Normal building/breaking with tools (default)
  # CREATIVE: Unlimited building, flying, instant break
  build-phase-gamemode: "SURVIVAL"
  
  # Phase 2: Combat phase duration in seconds (default: 2 minutes)
  combat-duration: 420
  
  
  # Phase 3: Result phase duration in seconds (default: 15 seconds)
  result-duration: 15
  
  # Intermediate result duration for matches (seconds)
  intermediate-result-duration: 15

# Game Mechanics
mechanics:
  # Spawn protection duration in seconds
  spawn-protection-duration: 3
  
  # Enemy spawn area protection radius in blocks
  # Prevents placing non-team blocks near enemy spawn
  enemy-spawn-protection-radius: 5

  # Build phase territory restriction (zone system)
  # Blocks the "rush to the enemy base and grief during build phase" strategy,
  # so build time is spent creating routes through the neutral zone instead.
  build-phase:
    # Enable/disable the restriction
    territory-restriction: true

    # Distance ratio threshold: distEnemy / (distOwn + distEnemy)
    # 1.0 = at own beacon, 0.5 = map center, 0.0 = at enemy beacon
    # Below this value the location is treated as enemy territory (no building during build phase)
    enemy-territory-ratio: 0.45

    # Blocks within this radius of an enemy beacon/spawn are always enemy territory
    # (only applied when the location is closer to the enemy base than to your own)
    enemy-beacon-no-build-radius: 20

  # Home core radius in blocks (horizontal distance from own beacon/spawn)
  # Inside this radius, enemy colored blocks deal no shield damage,
  # and enemy-placed blocks can be removed without the adjacency restriction.
  home-safe-radius: 8

  # Instantly break enemy-placed blocks inside the home core radius
  fast-remove-in-home: true

  # Currency refund per enemy-placed block removed inside the home core (0 = disabled)
  home-cleanup-reward: 2

  # Maximum total refund per team per game (0 = unlimited)
  home-cleanup-reward-cap: 60
  
  # NOT IMPLEMENTED YET:
  # flag-drop-timeout: 30  # Flag auto-return timeout in seconds
  # allow-ender-pearls: false
  # allow-elytra: false
  # allow-vehicles: false

# Match Settings
match:
  # Default number of games to play in a match
  default-target: 3
  
  # Interval between games removed - games start immediately

# Currency Settings
currency:
  # Currency display name
  name: "G"
  
  # Initial currency per team at game start
  initial: 50
  
  # Phase end bonus (given at end of combat phase)
  phase-end-bonus: 100
  
  # Kill rewards
  kill-reward: 15
  kill-assist-reward: 10
  carrier-kill-reward: 25
  carrier-kill-assist-reward: 10
  
  # Kill streak bonuses (additional currency per consecutive kill)
  kill-streak-bonus:
    2-kills: 5    # +5G for 2 consecutive kills
    3-kills: 10   # +10G for 3 consecutive kills
    4-kills: 15   # +15G for 4 consecutive kills
    5-plus-kills: 20  # +20G for 5+ consecutive kills
  
  # Capture rewards
  capture-reward: 50
  capture-assist-reward: 20

# Shop Settings
shop:
  # Enable shop system
  enabled: true
  
  # Discount rates based on score difference
  discount:
    1-point: 0.1    # 10% off
    2-point: 0.2    # 20% off
    3-point: 0.3    # 30% off
    4-point-plus: 0.4  # 40% off

# Knockback Snowball Settings
# Vanilla Knockback enchantment only applies to melee hits, so the plugin
# applies knockback itself when a shop knockback snowball hits an enemy.
snowball-knockback:
  enabled: true
  horizontal: 1.2                   # Horizontal push strength (blocks/tick)
  vertical: 0.4                     # Upward push strength

# Slime Block (Jump Pad) Settings
# Stepping on a slime block launches the player upward.
slime-block:
  enabled: true
  launch-vertical: 1.4              # Upward speed (blocks/tick). 1.0 ≈ 6 blocks, 1.4 ≈ 11 blocks
  launch-horizontal: 0.6            # Push in the movement direction (0 = straight up)
  cooldown-ms: 500                  # Minimum interval between launches per player

# Team Door Settings
# Iron doors / iron trapdoors placed during a game can only be opened by the
# team that placed them (right-click). Redstone does not move them.
# To avoid unbreakable stalemates, anyone can break them by hand in break-seconds.
team-door:
  enabled: true
  break-seconds: 3.0

# Shield Settings
shield:
  enabled: true                     # Enable/disable shield system
  max-shield: 100                   # Maximum shield value
  decrease-rate: 2.0                # Decrease rate on enemy blocks (per 0.5 seconds)
  recovery-rate: 5.0                # Recovery rate on friendly blocks (per 0.5 seconds)
  warning-threshold: 40             # Shield value for warning message
  critical-threshold: 20            # Shield value for critical warning
  damage-interval: 1000             # Damage interval when shield is 0 (milliseconds)
  damage-amount: 1.5                # Damage amount when shield is 0

# Event Chest Settings
event-chest:
  enabled: true                     # Enable/disable event chest system
  spawn-count: 1                     # Number of times chests spawn during combat phase (1=middle, 2=1/3 and 2/3, etc.)

# Economy Settings (Vault integration)
economy:
  # Reward per enemy player given to each winner
  reward-per-enemy: 100  # e.g., 4v4 = 400G per winner

# Debug Settings
debug:
  # Enable debug messages
  enabled: false
  
  # Log level (INFO, WARNING, SEVERE)
  log-level: "INFO"